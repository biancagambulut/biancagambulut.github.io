<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bianca Gambulut - Portfolio">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 950px;
      margin-top: 60px;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    h3 {
      text-align: center;
      font-size: 18px;
      font-weight: 300;
      color: #cccccc;
      margin-bottom: 35px;
    }

    .section {
      background: rgba(255, 255, 255, 0.06);
      padding: 28px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      margin-bottom: 30px;
      transition: 0.3s;
    }

    .section:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
    }

    .about-box {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .about-photo {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }

    .about-text {
      font-size: 16px;
      line-height: 1.7;
      color: #e5e5e5;
    }

    .btn {
      background: #00b4d8;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      display: inline-block;
      transition: 0.3s;
    }

    .btn:hover {
      background: #0096c7;
      transform: scale(1.05);
    }

    ul {
      line-height: 1.9;
      font-size: 16px;
    }

    a {
      color: #66cfff;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      color: #89d8ff;
    }

    /* Contact alignment */
    .contact-links {
      margin-top: 20px;
    }

    .contact-links a {
      display: inline-block;
      margin-right: 12px;
      font-size: 16px;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .about-box {
        flex-direction: column;
        text-align: center;
      }

      .about-photo {
        width: 160px;
        height: 160px;
      }

      .section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Bianca Gambulut</h1>
    <h3>Power BI Developer • Data Analyst</h3>

    <!-- ABOUT -->
    <div class="section about-box">

      <img src="me.jpg" class="about-photo">

      <div class="about-text">
        <h2>💁🏻‍♀️ About Me</h2>
        <p>I specialize in data visualization, dashboard design and transforming
        real data into business decisions using Power BI, DAX, data modeling and analytics.</p>
      </div>
    </div>

    <!-- SKILLS -->
    <div class="section">
      <h2>🧠 Skills</h2>
      <ul>
        <li>📊 Power BI & DAX</li>
        <li>🗂 Data modeling (Star schema)</li>
        <li>🧹 ETL and data cleaning</li>
        <li>🎨 Dashboard UX/UI</li>
        <li>🧠 SQL (basic)</li>
      </ul>
    </div>

    <!-- PROJECTS -->
    <div class="section">
      <h2>📈 Power BI Project</h2>
      <p><strong>Population Aged 0–3 Across European Countries</strong></p>
      <a href="https://biancagambulut.github.io/PowerBI---Portofolio/" class="btn" target="_blank">View Project</a>
    </div>

    <!-- CONTACT -->
    <div class="section">
      <h2>📫 Contact</h2>
      <p>Email: <strong>biancagambulut@gmail.com</strong></p>

      <div class="contact-links">
        <a class="btn" 
           href="https://www.linkedin.com/in/alexandra-bianca-gambulut-28b68a253" 
           target="_blank">Visit my LinkedIn</a>

        <a href="https://github.com/biancagambulut" target="_blank">🌐 GitHub</a>
      </div>
    </div>

  </div>
</body>
</html>
